<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>おもちゃ・点滅の確認</title>
  </head>
  <body>
    <main class="game-shell">
      <canvas aria-label="点滅を比較するおもちゃステージ"></canvas>
      <details class="diagnostic-panel" aria-label="点滅の確認">
        <summary id="diagnostic-summary">点滅の確認・診断版1</summary>
        <strong>点滅の確認・診断版1</strong>
        <p>Aで点滅を確認してから、Bに切り替えて同じように移動してください。</p>
        <div class="diagnostic-buttons">
          <button data-mode="normal">A 通常</button>
          <button data-mode="no-occlusion">B 透過なし</button>
          <button data-mode="precise-depth">C 奥行き精度</button>
          <button data-mode="no-antialias">D 輪郭処理なし</button>
          <button data-mode="plain-floor">E 床の重なりなし</button>
        </div>
        <p id="diagnostic-state" role="status">準備中…</p>
        <small
          >切り替えるたびに同じ配置から開始します。成長したら同じボタンでやり直せます。</small
        >
        <a href="/">通常のゲームへ戻る</a>
      </details>
    </main>
    <script type="module" src="./iphone-render.ts"></script>
  </body>
</html>
